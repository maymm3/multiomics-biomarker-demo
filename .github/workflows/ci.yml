name: Reproduce analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reproduce dataset, analysis, and tests
        run: make reproduce
      - name: Confirm committed evidence is reproducible
        run: git diff --exit-code -- data results
